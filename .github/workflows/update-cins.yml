name: Update CINS Army feed

on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest CINS Army snapshot
        run: |
          curl -sf "https://cinsscore.com/list/ci-badguys.txt" -o data/cins.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/cins.txt; then
            git add data/cins.txt
            git commit -m "Update CINS Army snapshot"
            git pull --rebase origin main
            git push
          else
            echo "No changes to feed data"
          fi
